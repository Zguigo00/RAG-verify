name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试（63+ 条断言）
        run: |
          PYTHONPATH=. python tests/test_p2.py
          PYTHONPATH=. python tests/test_pack.py
          PYTHONPATH=. python tests/test_audit.py
          PYTHONPATH=. python tests/test_report.py

      - name: 端到端冒烟（baseline → validate → run → audit）
        run: |
          python corpus/baseline.py --dataset dataset/dataset_v1.jsonl --out results/ci_baseline.jsonl
          python -m rag_eval.cli validate --dataset dataset/dataset_v1.jsonl --run-log results/ci_baseline.jsonl
          python -m rag_eval.cli run --dataset dataset/dataset_v1.jsonl --run-log results/ci_baseline.jsonl --out results/ci_results.json
          python -m rag_eval.cli audit --run-log results/ci_baseline.jsonl

  # κ 校准闸门：calibration/ 下有真实校准件才激活（见 calibration/README.md）。
  # κ < 0.6 时 calibrate 退出码 1，直接把构建判失败 —— rubric 改坏了就拦住。
  calibrate:
    if: ${{ hashFiles('calibration/judge_scores.json', 'calibration/human_labels.jsonl') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Cohen's κ 校准闸门
        run: |
          python -m rag_eval.cli calibrate \
            --judge-scores calibration/judge_scores.json \
            --human-labels calibration/human_labels.jsonl \
            --out results/calibration.json
