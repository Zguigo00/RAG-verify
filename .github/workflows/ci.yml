name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试（63 条断言）
        run: |
          PYTHONPATH=. python tests/test_p2.py
          PYTHONPATH=. python tests/test_pack.py
          PYTHONPATH=. python tests/test_audit.py

      - name: 端到端冒烟（baseline → validate → run → audit）
        run: |
          python corpus/baseline.py --dataset dataset/dataset_v1.jsonl --out results/ci_baseline.jsonl
          python -m rag_eval.cli validate --dataset dataset/dataset_v1.jsonl --run-log results/ci_baseline.jsonl
          python -m rag_eval.cli run --dataset dataset/dataset_v1.jsonl --run-log results/ci_baseline.jsonl --out results/ci_results.json
          python -m rag_eval.cli audit --run-log results/ci_baseline.jsonl
